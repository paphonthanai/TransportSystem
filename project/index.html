<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
  <title>มิตรกาญจน์ - Transportation Management System</title>

  <!-- PWA: Driver App installability (Add to Home Screen) — ดู public/manifest.json, public/sw.js -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Driver App" />
</head>
<body>
  <div id="app">
    <!-- หน้าจอรอก่อนโหลดสคริปต์เสร็จ — Vue จะแทนที่ทั้งก้อนนี้ตอน mount -->
    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f4f6fb;color:#64748b;font:14px sans-serif">
      <div class="boot-spinner"></div>
      <div>กำลังโหลด...</div>
    </div>
    <style>
      .boot-spinner { width: 36px; height: 36px; border: 3px solid rgba(37,99,235,.2); border-top-color: #2563eb; border-radius: 50%; animation: boot-spin .8s linear infinite }
      @keyframes boot-spin { to { transform: rotate(360deg) } }
    </style>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
